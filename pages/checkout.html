<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Nexora.Find</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="../index.html" class="logo">Nexora<span class="dot"></span>Find</a>
    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="shop.html">Shop</a>
    </nav>
    <div class="nav-icons">
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
        <span class="cart-badge" data-cart-count style="display:none">0</span>
      </a>
    </div>
  </div>
</header>

<div class="wrap crumb"><a href="../index.html">Home</a><span>/</span><a href="cart.html">Cart</a><span>/</span>Checkout</div>

<section style="padding-top:20px">
  <div class="wrap">
    <div class="section-head"><h2>Checkout</h2></div>
    <div id="checkout-content"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none;margin-top:0">
      <span>© 2026 Nexora.Find. All rights reserved.</span>
      <span>256-bit secure checkout · Prices in ₹ INR</span>
    </div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script>
  const items = Cart.lineItems();
  const root = document.getElementById("checkout-content");

  if (!items.length) {
    root.innerHTML = `
      <div class="empty-cart">
        <h3>Your cart is empty</h3>
        <p>Add something you love before checking out.</p>
        <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
      </div>`;
  } else {
    const subtotal = Cart.subtotal();
    const shipping = subtotal >= 999 ? 0 : 79;
    const total = subtotal + shipping;

    root.innerHTML = `
      <div class="checkout-layout">
        <form id="checkout-form">
          <div class="co-step">
            <h3><span class="num">1</span> Customer Information</h3>
            <div class="form-grid">
              <div class="field"><label>Full Name</label><input type="text" name="full_name" required placeholder="Aditi Sharma"></div>
              <div class="field"><label>Phone Number</label><input type="tel" name="phone" required pattern="[0-9]{10}" placeholder="9876543210"></div>
              <div class="field" style="grid-column:1/-1"><label>Email</label><input type="email" name="email" required placeholder="you@email.com"></div>
            </div>
          </div>

          <div class="co-step">
            <h3><span class="num">2</span> Shipping Address</h3>
            <div class="form-grid">
              <div class="field" style="grid-column:1/-1"><label>Address Line</label><input type="text" name="address" required placeholder="House no., building, street"></div>
              <div class="field"><label>City</label><input type="text" name="city" required placeholder="Mumbai"></div>
              <div class="field"><label>State</label><input type="text" name="state" required placeholder="Maharashtra"></div>
              <div class="field"><label>Pincode</label><input type="text" name="pincode" required pattern="[0-9]{6}" placeholder="400001"></div>
              <div class="field"><label>Landmark (optional)</label><input type="text" name="landmark" placeholder="Near..."></div>
            </div>
          </div>

          <div class="co-step">
            <h3><span class="num">3</span> Payment Method</h3>
            <div class="pay-options">
              <label class="pay-opt active"><input type="radio" name="pay" value="upi" checked> UPI (GPay / PhonePe / Paytm)</label>
              <label class="pay-opt"><input type="radio" name="pay" value="card"> Credit / Debit Card</label>
              <label class="pay-opt"><input type="radio" name="pay" value="cod"> Cash on Delivery</label>
            </div>
          </div>

          <div id="checkout-error" role="alert" style="display:none;background:#fdf1ef;border:1px solid rgba(179,64,47,.28);color:#b3402f;border-radius:14px;padding:13px 16px;font-size:14px;line-height:1.45;margin-bottom:16px"></div>

          <button type="submit" id="place-order-btn" class="btn btn-primary btn-block" style="padding:17px">Place Order — ${formatINR(total)}</button>
          <div class="trust-strip">
            <span>🔒 Secure checkout</span>
            <span>↩ 7-day easy returns</span>
            <span>🚚 Delivered in 3–6 days</span>
          </div>
        </form>

        <div class="summary-card">
          <h4 style="font-size:14px;margin-bottom:16px">Order Summary</h4>
          ${items.map(li => `
            <div class="mini-cart-item">
              <img src="${li.product.img}" alt="${li.product.name}">
              <div>
                <div class="name">${li.product.name}</div>
                <div class="qty">${li.variant ? li.variant + " · " : ""}Qty ${li.qty}</div>
              </div>
              <div class="price">${formatINR(li.product.price * li.qty)}</div>
            </div>
          `).join("")}
          <div class="summary-row" style="margin-top:16px"><span>Subtotal</span><span>${formatINR(subtotal)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? "FREE" : formatINR(shipping)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatINR(total)}</span></div>
        </div>
      </div>
    `;

    document.querySelectorAll(".pay-opt").forEach(opt => opt.addEventListener("click", () => {
      document.querySelectorAll(".pay-opt").forEach(o => o.classList.remove("active"));
      opt.classList.add("active");
      opt.querySelector("input").checked = true;
    }));

    document.getElementById("checkout-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = e.currentTarget;
      const btn = document.getElementById("place-order-btn");
      const errBox = document.getElementById("checkout-error");
      const btnLabel = btn.textContent;

      const fd = new FormData(form);
      const payload = {
        customer: {
          name: fd.get("full_name"),
          phone: fd.get("phone"),
          email: fd.get("email")
        },
        shipping: {
          address: fd.get("address"),
          city: fd.get("city"),
          state: fd.get("state"),
          pincode: fd.get("pincode"),
          landmark: fd.get("landmark")
        },
        payment_method: fd.get("pay"),
        items: items.map((li) => ({ id: li.id, qty: li.qty, variant: li.variant }))
      };

      btn.disabled = true;
      btn.textContent = "Placing order…";
      errBox.style.display = "none";

      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          throw new Error(data.error || "We couldn't place your order. Please try again.");
        }
        // Same sessionStorage contract as before — order-confirmation.html is unchanged.
        sessionStorage.setItem(
          "nexora_last_order",
          JSON.stringify({ orderId: data.orderId, total: data.total, items: data.items })
        );
        Cart.clear();
        location.href = "order-confirmation.html";
      } catch (err) {
        errBox.textContent = err.message + " Your cart is safe — nothing was charged.";
        errBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = btnLabel;
        errBox.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Nexora.Find</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="../index.html" class="logo">Nexora<span class="dot"></span>Find</a>
    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="shop.html?filter=Trending">Trending</a>
      <a href="shop.html?filter=New">New Arrivals</a>
      <a href="about.html">About</a>
    </nav>
    <div class="nav-icons">
      <button class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
        <span class="cart-badge" data-cart-count style="display:none">0</span>
      </a>
      <button class="icon-btn nav-burger" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</header>

<div class="wrap crumb"><a href="../index.html">Home</a><span>/</span>Cart</div>

<section style="padding-top:20px">
  <div class="wrap">
    <div class="section-head"><h2>Your Cart</h2></div>
    <div id="cart-content"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-grid">
      <div class="footer-brand">
        <a href="../index.html" class="logo">Nexora<span class="dot"></span>Find</a>
        <p>Trending, useful, and unique products — curated for young India and delivered to your door.</p>
      </div>
      <div class="footer-col"><h4>Shop</h4><a href="shop.html">All Products</a></div>
      <div class="footer-col"><h4>Support</h4><a href="support.html">Customer Support</a></div>
      <div class="footer-col"><h4>Company</h4><a href="about.html">About</a></div>
    </div>
    <div class="footer-bottom"><span>© 2026 Nexora.Find. All rights reserved.</span><span>Prices in ₹ INR</span></div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script>
  let appliedCoupon = null;
  const COUPONS = { NEXORA10: 0.10, WELCOME50: 50 };

  function shippingFee(subtotal) { return subtotal === 0 || subtotal >= 999 ? 0 : 79; }

  function couponDiscount(subtotal) {
    if (!appliedCoupon) return 0;
    const rule = COUPONS[appliedCoupon];
    if (rule === undefined) return 0;
    return rule < 1 ? Math.round(subtotal * rule) : rule;
  }

  function render() {
    const items = Cart.lineItems();
    const root = document.getElementById("cart-content");

    if (!items.length) {
      root.innerHTML = `
        <div class="empty-cart">
          <h3>Your cart is empty</h3>
          <p>Looks like you haven't found your next favourite thing yet.</p>
          <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
        </div>`;
      return;
    }

    const subtotal = Cart.subtotal();
    const discount = couponDiscount(subtotal);
    const shipping = shippingFee(subtotal - discount);
    const total = subtotal - discount + shipping;

    root.innerHTML = `
      <div class="cart-layout">
        <div>
          ${items.map(li => `
            <div class="cart-row">
              <div class="cart-thumb"><img src="${li.product.img}" alt="${li.product.name}"></div>
              <div>
                <div class="cart-name">${li.product.name}</div>
                <div class="cart-meta">${li.variant ? li.variant + " · " : ""}${formatINR(li.product.price)} each</div>
                <div class="cart-remove" data-remove="${li.id}" data-variant="${li.variant || ''}">Remove</div>
              </div>
              <div class="qty-control">
                <button data-dec="${li.id}" data-variant="${li.variant || ''}">−</button>
                <span class="val">${li.qty}</span>
                <button data-inc="${li.id}" data-variant="${li.variant || ''}">+</button>
              </div>
              <div class="cart-price">${formatINR(li.product.price * li.qty)}</div>
            </div>
          `).join("")}
          <a href="shop.html" class="btn btn-outline" style="margin-top:24px">← Continue Shopping</a>
        </div>

        <div class="summary-card">
          <div class="coupon-row">
            <input type="text" id="coupon-input" placeholder="Coupon code" value="${appliedCoupon || ''}">
            <button class="btn btn-primary btn-sm" id="apply-coupon">Apply</button>
          </div>
          <p class="coupon-msg" id="coupon-msg" style="color:${discount ? 'var(--emerald)' : 'var(--danger)'}"></p>
          <div class="summary-row"><span>Subtotal</span><span>${formatINR(subtotal)}</span></div>
          ${discount ? `<div class="summary-row"><span>Coupon Discount</span><span>− ${formatINR(discount)}</span></div>` : ""}
          <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? "FREE" : formatINR(shipping)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatINR(total)}</span></div>
          <a href="checkout.html" class="btn btn-primary btn-block">Proceed to Checkout</a>
          <p style="font-size:11.5px;color:var(--gray-500);margin-top:14px;text-align:center">Free shipping on orders over ₹999</p>
        </div>
      </div>
    `;

    root.querySelectorAll("[data-inc]").forEach(b => b.addEventListener("click", () => {
      const li = items.find(i => i.id === b.dataset.inc && (i.variant || '') === b.dataset.variant);
      Cart.updateQty(li.id, li.variant, li.qty + 1); render();
    }));
    root.querySelectorAll("[data-dec]").forEach(b => b.addEventListener("click", () => {
      const li = items.find(i => i.id === b.dataset.dec && (i.variant || '') === b.dataset.variant);
      Cart.updateQty(li.id, li.variant, li.qty - 1); render();
    }));
    root.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => {
      Cart.remove(b.dataset.remove, b.dataset.variant || null); render();
    }));
    document.getElementById("apply-coupon").addEventListener("click", () => {
      const code = document.getElementById("coupon-input").value.trim().toUpperCase();
      const msg = document.getElementById("coupon-msg");
      if (COUPONS[code] !== undefined) {
        appliedCoupon = code;
        msg.style.color = "var(--emerald)";
        msg.textContent = "Coupon applied!";
      } else {
        appliedCoupon = null;
        msg.style.color = "var(--danger)";
        msg.textContent = "Invalid coupon code.";
      }
      render();
    });
  }

  render();
</script>
</body>
</html>
